<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Web98</title>
    <link rel="stylesheet" href="../../assets/ie5/theme.css" />
    <link rel="stylesheet" href="../../css/ie5-shell.css" />
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body>
    <div class="ow-root win is-active" id="app">
      <!-- title bar -->
      <div class="ow-titlebar" id="titlebar">
        <span class="ow-titlebar__icon"></span>
        <span class="ow-titlebar__text" id="win-title">Web98</span>
        <span class="ow-titlebar__controls">
          <button class="ow-winbtn" data-control="minimize" title="Minimize"></button>
          <button class="ow-winbtn" data-control="maximize" id="btn-max" title="Maximize"></button>
          <button class="ow-winbtn" data-control="close" title="Close"></button>
        </span>
      </div>

      <!-- menu bar -->
      <div class="ow-menubar" id="menubar"></div>

      <!-- toolbar -->
      <div class="ow-toolbar" id="toolbar"></div>

      <!-- address bar -->
      <div class="ow-addressbar">
        <span class="ow-address-label">Address</span>
        <span class="ow-address-combo">
          <span class="ow-address-icon"></span>
          <input
            class="ow-address-input"
            id="address"
            type="text"
            autocomplete="off"
            spellcheck="false"
            aria-label="Address"
          />
          <button class="ow-address-dropdown" id="addr-drop" title="Show history"></button>
          <div class="ow-address-list" id="addr-list" hidden></div>
        </span>
        <button class="ow-go" id="btn-go"><span class="ow-go__icon"></span>Go</button>
        <span class="ow-loc-links" id="btn-links" title="Favorites bar">&#8250; Links</span>
      </div>

      <!-- tab strip -->
      <div class="ow-tabstrip" id="tabstrip"></div>

      <!-- find bar -->
      <div id="findbar">
        <span class="find-label">Find:</span>
        <input type="text" id="find-input" spellcheck="false" />
        <label style="font-size: 11px; margin-left: 6px;"><input type="checkbox" id="find-case" /> Match case</label>
        <span id="find-count" style="font-size: 11px; margin-left: 6px; color: #404040;"></span>
        <button class="w98-btn" id="find-next" style="min-width: 60px">Next</button>
        <button class="w98-btn" id="find-prev" style="min-width: 60px">Previous</button>
        <button class="w98-btn" id="find-close" style="min-width: 60px">Close</button>
      </div>

      <!-- content row: side panel + page area (tab views overlay the ghost) -->
      <div id="content-row">
        <div id="sidepanel">
          <div class="sidepanel__head">
            <span class="sidepanel__title" id="sidepanel-title">Favorites</span>
            <button id="sidepanel-close" title="Close">&#215;</button>
          </div>
          <div class="sidepanel__body" id="sidepanel-body"></div>
          <div class="sidepanel__foot" id="sidepanel-foot"></div>
        </div>
        <div id="content-ghost"></div>
      </div>

      <!-- status bar -->
      <div class="ow-statusbar">
        <span class="ow-status-text" id="status">Done</span>
        <span class="ow-progress" id="progress"><span class="ow-progress__bar" id="progress-bar"></span></span>
        <span class="ow-zone" id="zone">Internet zone</span>
      </div>
    </div>

    <!-- floating layers -->
    <div id="ctxlayer"></div>

    <!-- in-window dialogs -->
    <div id="dialogs"></div>

    <script src="chrome.js"></script>
  </body>
</html>
