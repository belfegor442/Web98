<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Saved Passwords</title>
    <link rel="stylesheet" href="../../../assets/ie5/theme.css" />
    <link rel="stylesheet" href="../../../css/ie5-shell.css" />
    <link rel="stylesheet" href="dialogs.css" />
    <style>
      .side-btns {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 130px;
        flex: 0 0 auto;
      }
      .side-btns .w98-btn { width: 100%; }
      .pw-row {
        display: flex;
        gap: 6px;
        align-items: center;
        flex: 0 0 auto;
      }
      .pw-row .w98-input { flex: 1 1 auto; }
      .pw-mask {
        color: #404040;
        flex: 0 0 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        height: 14px;
      }
    </style>
  </head>
  <body>
    <div class="ow-root win is-active">
      <div class="ow-titlebar">
        <span class="ow-titlebar__icon"></span>
        <span class="ow-titlebar__text">Saved Passwords</span>
        <span class="ow-titlebar__controls">
          <button class="ow-winbtn" data-control="close" title="Close"></button>
        </span>
      </div>
      <div class="dlg-body">
        <div class="cols">
          <div class="w98-list" id="list"></div>
          <div class="col side-btns">
            <button class="w98-btn" id="btn-new">New...</button>
            <button class="w98-btn" id="btn-show" disabled>Show</button>
            <button class="w98-btn" id="btn-delete" disabled>Delete</button>
            <button class="w98-btn" id="btn-clear">Delete All</button>
            <span class="spacer"></span>
            <button class="w98-btn is-default" id="btn-close">Close</button>
          </div>
        </div>
        <div class="editor" id="editor">
          <label for="ed-origin">Site:</label>
          <input class="w98-input" id="ed-origin" type="text" placeholder="https://example.com" />
          <label for="ed-user">User:</label>
          <input class="w98-input" id="ed-user" type="text" />
          <label for="ed-pass">Password:</label>
          <input class="w98-input" id="ed-pass" type="password" />
          <button class="w98-btn small" id="ed-ok">OK</button>
          <button class="w98-btn small" id="ed-cancel">Cancel</button>
        </div>
        <div class="pw-mask" id="pw-mask"></div>
      </div>
    </div>
    <script src="dlg.js"></script>
    <script>
      (function () {
        var list = document.getElementById('list');
        var mask = document.getElementById('pw-mask');
        var editor = document.getElementById('editor');
        var edOrigin = document.getElementById('ed-origin');
        var edUser = document.getElementById('ed-user');
        var edPass = document.getElementById('ed-pass');
        var btnShow = document.getElementById('btn-show');
        var btnDelete = document.getElementById('btn-delete');
        var all = [];
        var shown = {};

        var sel = dlg.bindList(list, {
          onSelect: function (item) {
            btnShow.disabled = !item;
            btnDelete.disabled = !item;
            mask.textContent = item ? item.origin + ' — ' + (item.username || '(no user)') : '';
          }
        });

        function render() {
          list.textContent = '';
          all.forEach(function (r) {
            var row = document.createElement('div');
            row.className = 'row';
            row._item = r;
            var img = document.createElement('img');
            img.src = '../../../assets/ie5/assets/ie-logo.png';
            row.appendChild(img);
            var grow = document.createElement('span');
            grow.className = 'grow';
            grow.textContent = r.origin + '  (' + (r.username || '—') + ')';
            row.appendChild(grow);
            list.appendChild(row);
          });
          if (!all.length) {
            var none = document.createElement('div');
            none.className = 'empty';
            none.innerHTML = '<span class="ico"></span><span class="msg">No saved passwords.</span>';
            list.appendChild(none);
          }
        }

        function load() {
          dlg.invoke('passwords:list').then(function (rows) {
            all = rows || [];
            render();
            var selected = sel.selected();
            if (selected) {
              var fresh = all.find(function (r) { return r.id === selected.id; });
              if (fresh) sel.select(fresh); else sel.clear();
            }
          });
        }

        function openEditor() {
          edOrigin.value = '';
          edUser.value = '';
          edPass.value = '';
          editor.classList.add('is-open');
          edOrigin.focus();
        }
        function closeEditor() {
          editor.classList.remove('is-open');
        }

        document.getElementById('btn-new').addEventListener('click', openEditor);
        document.getElementById('ed-cancel').addEventListener('click', closeEditor);
        document.getElementById('ed-ok').addEventListener('click', function () {
          var origin = edOrigin.value.trim();
          var user = edUser.value.trim();
          var pass = edPass.value;
          if (!origin || !pass) { closeEditor(); return; }
          dlg.invoke('passwords:save', { origin: origin, username: user, password: pass })
            .then(function () {
              closeEditor();
              load();
            });
        });
        edPass.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') document.getElementById('ed-ok').click();
          if (e.key === 'Escape') closeEditor();
        });

        btnShow.addEventListener('click', function () {
          var item = sel.selected();
          if (!item) return;
          if (shown[item.id]) {
            mask.textContent = item.origin + ' — ' + shown[item.id];
            return;
          }
          dlg.invoke('passwords:get', { id: item.id }).then(function (r) {
            if (r && r.ok) {
              shown[item.id] = r.password;
              mask.textContent = item.origin + ' — ' + r.password;
            }
          });
        });
        btnDelete.addEventListener('click', function () {
          var item = sel.selected();
          if (!item) return;
          dlg.invoke('passwords:delete', { id: item.id }).then(load);
        });
        document.getElementById('btn-clear').addEventListener('click', function () {
          if (!all.length) return;
          if (!window.confirm('Delete ALL saved passwords?')) return;
          dlg.invoke('passwords:clear').then(function () {
            shown = {};
            load();
          });
        });
        document.getElementById('btn-close').addEventListener('click', function () {
          dlg.close();
        });

        load();
      })();
    </script>
  </body>
</html>
